<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101418"><title>RUNMATE — 나와의 레이스</title><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#0d1115;color:#f7f8fa}.app{max-width:560px;margin:auto;min-height:100vh;padding:18px 16px 96px}header{display:flex;justify-content:space-between;align-items:center;margin:5px 0 20px}.logo{font-weight:900;font-size:25px}.tag,.muted,small{color:#9aa5af}.card{background:#171d23;border:1px solid #26313a;border-radius:22px;padding:18px;margin:12px 0}.big{font-size:46px;font-weight:900;margin:4px 0}.unit{font-size:17px;color:#aab4bd}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#10161b;border-radius:17px;padding:15px}.metric b{display:block;font-size:27px;margin-top:5px}button,input,select{font:inherit}button{border:0;border-radius:16px;padding:15px 16px;font-weight:800}.primary{width:100%;background:#f5f7f8;color:#0d1115;font-size:18px}.danger{width:100%;background:#ff5c5c;color:white}.secondary{background:#26313a;color:white;width:100%}.row{display:flex;gap:9px}.row>*{flex:1}.ghost{margin-top:12px;padding:13px;border-radius:15px;background:#202831;font-weight:700}label{display:block;color:#aab4bd;font-size:13px;margin:12px 0 6px}input,select{width:100%;padding:13px;border-radius:13px;border:1px solid #33404a;background:#10161b;color:white}.tabs{position:fixed;bottom:0;left:0;right:0;background:#11171cef;border-top:1px solid #26313a;display:flex;justify-content:center;padding:9px 10px calc(9px + env(safe-area-inset-bottom))}.tabs div{max-width:560px;width:100%;display:flex}.tab{flex:1;background:transparent;color:#8e9aa4;padding:9px 4px;font-size:12px}.page{display:none}.page.active{display:block}.history{padding:0;margin:0;list-style:none}.history li{padding:13px 0;border-bottom:1px solid #283139;display:flex;justify-content:space-between}.d-day{text-align:center;font-size:36px;font-weight:900;margin:12px 0}</style></head><body><div class="app"><header><div><div class="logo">RUNMATE</div><div class="tag">오늘의 경쟁자는 어제의 나</div></div><b>GPS</b></header><section id="home" class="page active"><div class="card"><small>이번 달 누적</small><div class="big"><span id="monthKm">0.00</span><span class="unit"> km</span></div><div class="grid"><div class="metric"><small>러닝 횟수</small><b id="monthRuns">0</b></div><div class="metric"><small>최근 평균 페이스</small><b id="lastPace">--</b></div></div></div><div class="card"><b>🏁 대회 D-Day</b><div id="ddayText" class="d-day">대회를 등록하세요</div><div id="raceName" class="muted" style="text-align:center"></div></div><button class="primary" onclick="showPage('run')">러닝 시작하기</button></section><section id="run" class="page"><div class="card"><small id="gpsState">GPS 준비</small><div class="big"><span id="distance">0.00</span><span class="unit"> km</span></div><div class="grid"><div class="metric"><small>시간</small><b id="time">00:00</b></div><div class="metric"><small>평균 페이스</small><b id="pace">--</b></div></div><div class="ghost" id="ghost">👻 이전 러닝 기록이 있으면 자동 비교합니다.</div></div><div class="row"><button class="primary" onclick="startRun()">▶ 시작</button><button class="secondary" onclick="pauseRun()">Ⅱ 일시정지</button></div><br><button class="danger" onclick="finishRun()">■ 종료 · 저장</button></section><section id="records" class="page"><div class="card"><b>🏆 러닝 기록</b><ul id="history" class="history"></ul></div><button class="secondary" onclick="clearRecords()">기록 전체 삭제</button></section><section id="settings" class="page"><div class="card"><b>🎯 목표 / 대회 설정</b><label>목표 거리</label><select id="targetDistance"><option value="5">5 km</option><option value="10" selected>10 km</option><option value="21.0975">하프 마라톤</option></select><label>목표 시간 (분)</label><input id="targetMinutes" type="number" value="60"><div id="targetPace" class="ghost">목표 페이스 6'00"/km</div><label>대회명</label><input id="raceInput" placeholder="예: 하프마라톤"><label>대회 날짜</label><input id="raceDate" type="date"><br><br><button class="primary" onclick="saveSettings()">저장</button></div></section></div><nav class="tabs"><div><button class="tab" onclick="showPage('home')">홈</button><button class="tab" onclick="showPage('run')">러닝</button><button class="tab" onclick="showPage('records')">기록</button><button class="tab" onclick="showPage('settings')">설정</button></div></nav><script>let watchId=null,timer=null,running=false,paused=false,startAt=0,elapsed=0,km=0,lastPos=null,announced=0;const $=id=>document.getElementById(id);function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}function hav(a,b){const R=6371,dLat=(b.latitude-a.latitude)*Math.PI/180,dLon=(b.longitude-a.longitude)*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(a.latitude*Math.PI/180)*Math.cos(b.latitude*Math.PI/180)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}function fmtTime(s){s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function fmtPace(p){if(!isFinite(p)||p<=0)return'--';let m=Math.floor(p/60),s=Math.round(p%60);return m+"'"+String(s).padStart(2,'0')+'"'}function tick(){if(running&&!paused){elapsed=(Date.now()-startAt)/1000;$('time').textContent=fmtTime(elapsed);$('pace').textContent=fmtPace(elapsed/km);ghost()}}function startRun(){if(running){paused=false;startAt=Date.now()-elapsed*1000;return}if(!navigator.geolocation){alert('GPS를 사용할 수 없습니다.');return}running=true;startAt=Date.now();timer=setInterval(tick,1000);$('gpsState').textContent='GPS 연결 중…';watchId=navigator.geolocation.watchPosition(pos=>{if(paused)return;let p=pos.coords;$('gpsState').textContent='GPS 수신 · 정확도 약 '+Math.round(p.accuracy)+'m';if(lastPos&&p.accuracy<60){let d=hav(lastPos,p);if(d<.2)km+=d}lastPos={latitude:p.latitude,longitude:p.longitude};$('distance').textContent=km.toFixed(2);let w=Math.floor(km);if(w>announced){announced=w;speak(w+'킬로미터 통과')}} ,()=>{$('gpsState').textContent='GPS 권한을 허용해주세요.'},{enableHighAccuracy:true,maximumAge:1000,timeout:10000})}function pauseRun(){if(!running)return;paused=!paused;if(!paused)startAt=Date.now()-elapsed*1000;$('gpsState').textContent=paused?'일시정지':'러닝 중'}function finishRun(){if(!running)return;running=false;clearInterval(timer);if(watchId!==null)navigator.geolocation.clearWatch(watchId);let arr=JSON.parse(localStorage.getItem('runs')||'[]');arr.unshift({date:new Date().toISOString(),km:+km.toFixed(2),seconds:Math.round(elapsed),pace:km?elapsed/km:0});localStorage.setItem('runs',JSON.stringify(arr));render();showPage('records')}function speak(t){if('speechSynthesis'in window)speechSynthesis.speak(new SpeechSynthesisUtterance(t))}function ghost(){let a=JSON.parse(localStorage.getItem('runs')||'[]');if(!a.length)return;let g=a[0],diff=km-elapsed/(g.seconds/g.km);$('ghost').textContent='👻 지난 기록보다 '+Math.abs(Math.round(diff*1000))+'m '+(diff>=0?'앞서는 중':'뒤처지는 중')}function clearRecords(){if(confirm('모두 삭제할까요?')){localStorage.removeItem('runs');render()}}function saveSettings(){let s={dist:+$('targetDistance').value,mins:+$('targetMinutes').value,race:$('raceInput').value,date:$('raceDate').value};localStorage.setItem('settings',JSON.stringify(s));render();alert('저장했습니다.')}function render(){let a=JSON.parse(localStorage.getItem('runs')||'[]'),n=new Date(),m=a.filter(r=>{let d=new Date(r.date);return d.getMonth()==n.getMonth()&&d.getFullYear()==n.getFullYear()});$('monthKm').textContent=m.reduce((x,r)=>x+r.km,0).toFixed(2);$('monthRuns').textContent=m.length;$('lastPace').textContent=a.length?fmtPace(a[0].pace):'--';$('history').innerHTML=a.length?a.map(r=>'<li><span>'+new Date(r.date).toLocaleDateString('ko-KR')+'<br><small>'+fmtTime(r.seconds)+'</small></span><b>'+r.km.toFixed(2)+' km<br><small>'+fmtPace(r.pace)+'/km</small></b></li>').join(''):'<li>아직 기록이 없습니다.</li>';let s=JSON.parse(localStorage.getItem('settings')||'{}');if(s.dist)$('targetDistance').value=s.dist;if(s.mins)$('targetMinutes').value=s.mins;if(s.race!==undefined)$('raceInput').value=s.race;if(s.date)$('raceDate').value=s.date;$('targetPace').textContent='목표 페이스 '+fmtPace((+$('targetMinutes').value)*60/(+$('targetDistance').value))+'/km';if(s.date){let t=new Date();t.setHours(0,0,0,0);let d=new Date(s.date+'T00:00:00'),days=Math.ceil((d-t)/86400000);$('ddayText').textContent=days>=0?'D-'+days:'D+'+Math.abs(days);$('raceName').textContent=s.race||'등록된 대회'}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
