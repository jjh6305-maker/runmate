<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101418"><title>RUNMATE</title><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#0d1115;color:#f7f8fa}.app{max-width:560px;margin:auto;min-height:100vh;padding:18px 16px 96px}.logo{font-weight:900;font-size:25px}.muted,small{color:#9aa5af}.card{background:#171d23;border:1px solid #26313a;border-radius:22px;padding:18px;margin:12px 0}.big{font-size:46px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#10161b;border-radius:17px;padding:15px}.metric b{display:block;font-size:27px}button,input,textarea{font:inherit}button{border:0;border-radius:16px;padding:14px;font-weight:800}.primary{width:100%;background:#f5f7f8;color:#0d1115}.secondary{width:100%;background:#26313a;color:white}.danger{width:100%;background:#ff5c5c;color:white}.row{display:flex;gap:9px}.row>*{flex:1}.ghost{margin-top:12px;padding:13px;border-radius:15px;background:#202831}.tabs{position:fixed;bottom:0;left:0;right:0;background:#11171cef;border-top:1px solid #26313a;padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center}.tabs div{max-width:560px;width:100%;display:flex}.tab{flex:1;background:transparent;color:#8e9aa4;padding:8px 3px;font-size:12px}.starTab{font-size:25px;line-height:22px}.page{display:none}.page.active{display:block}.history{padding:0;list-style:none}.history li{padding:13px 0;border-bottom:1px solid #283139;display:flex;justify-content:space-between}.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.photoItem{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:#10161b}.photoItem img{width:100%;height:100%;object-fit:cover}.del{position:absolute;right:6px;top:6px;width:34px;height:34px;padding:0;border-radius:50%;background:#111c;color:#fff;font-size:20px}.count{text-align:right;color:#9aa5af}.canvas{width:100%;border-radius:18px;margin-top:12px;display:none}.course{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.course button{padding:11px 3px;background:#26313a;color:#fff;font-size:13px}.course button.on{background:#f5f7f8;color:#0d1115}label{display:block;color:#aab4bd;font-size:13px;margin:12px 0 6px}input,textarea{width:100%;padding:13px;border-radius:13px;border:1px solid #33404a;background:#10161b;color:white}.caption{min-height:88px;resize:vertical}.captionBox{margin:14px 0;padding:14px;border-radius:17px;background:#10161b;border:1px solid #26313a}</style></head><body><div class="app"><header><div class="logo">RUNMATE</div><small>오늘의 경쟁자는 어제의 나</small></header><section id="home" class="page active"><div class="card"><small>이번 달 누적</small><div class="big"><span id="monthKm">0.00</span> km</div><div class="grid"><div class="metric"><small>러닝 횟수</small><b id="monthRuns">0</b></div><div class="metric"><small>최근 평균 페이스</small><b id="lastPace">--</b></div></div></div><button class="primary" onclick="showPage('run')">러닝 시작하기</button></section><section id="run" class="page"><div class="card"><small id="gpsState">GPS 준비</small><div class="big"><span id="distance">0.00</span> km</div><div class="grid"><div class="metric"><small>시간</small><b id="time">00:00</b></div><div class="metric"><small>평균 페이스</small><b id="pace">--</b></div></div><div class="ghost">👻 이전 러닝 기록과 비교합니다.</div></div><div class="row"><button class="primary" onclick="startRun()">▶ 시작</button><button class="secondary" onclick="pauseRun()">Ⅱ 일시정지</button></div><br><button class="danger" onclick="finishRun()">■ 종료 · 저장</button></section><section id="share" class="page"><div class="card"><div style="font-size:30px">★</div><div class="count"><span id="photoCount">0</span> / 10</div><input id="runPhoto" type="file" accept="image/*" multiple onchange="loadPhotos(event)" style="margin-top:10px"><div id="photos" class="photos"></div><button class="secondary" onclick="$('runPhoto').click()">카메라 · 앨범에서 사진 추가</button><div class="captionBox"><label for="photoText" style="margin-top:0">사진에 넣을 글</label><textarea id="photoText" class="caption" maxlength="80" placeholder="예: 오늘도 한 걸음 더 멀리!&#10;포기하지 않으면 결국 도착한다."></textarea><small>최대 80자 · 입력한 문구가 사진에 감성적인 손글씨 느낌으로 표시됩니다.</small></div><canvas id="canvas" class="canvas" width="1080" height="1350"></canvas><p id="shareHint" class="muted">최대 10장까지 선택할 수 있습니다. 각 사진의 × 버튼으로 삭제할 수 있습니다.</p><button class="primary" onclick="makeImage()">★ 인증 이미지 만들기</button><br><br><div class="row"><button class="secondary" onclick="saveImage()">이미지 저장</button><button class="secondary" onclick="shareImage()">공유하기</button></div></div></section><section id="records" class="page"><div class="card"><b>🏆 러닝 기록</b><ul id="history" class="history"></ul></div></section><section id="settings" class="page"><div class="card"><b>🎯 목표 설정</b><label>목표 거리</label><div class="course"><button data-km="5" onclick="setCourse(this)">5km</button><button data-km="10" class="on" onclick="setCourse(this)">10km</button><button data-km="21.0975" onclick="setCourse(this)">하프</button><button data-km="42.195" onclick="setCourse(this)">풀코스</button></div><input id="targetDistance" type="hidden" value="10"><label>목표 시간(분)</label><input id="targetMinutes" type="number" value="60"></div></section></div><nav class="tabs"><div><button class="tab" onclick="showPage('home')">홈</button><button class="tab" onclick="showPage('run')">러닝</button><button class="tab starTab" onclick="showPage('share')">★</button><button class="tab" onclick="showPage('records')">기록</button><button class="tab" onclick="showPage('settings')">설정</button></div></nav><script>let watchId=null,timer=null,running=false,paused=false,startAt=0,elapsed=0,km=0,lastPos=null,photos=[],blob=null;const $=id=>document.getElementById(id);function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}function setCourse(b){document.querySelectorAll('.course button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('targetDistance').value=b.dataset.km;localStorage.setItem('targetDistance',b.dataset.km)}function hav(a,b){const R=6371,dLat=(b.latitude-a.latitude)*Math.PI/180,dLon=(b.longitude-a.longitude)*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(a.latitude*Math.PI/180)*Math.cos(b.latitude*Math.PI/180)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}function fmtTime(s){s=Math.floor(s);let h=Math.floor(s/3600),m=Math.floor(s%3600/60),q=s%60;return h?String(h)+':'+String(m).padStart(2,'0')+':'+String(q).padStart(2,'0'):String(m).padStart(2,'0')+':'+String(q).padStart(2,'0')}function fmtPace(p){if(!isFinite(p)||p<=0)return'--';let m=Math.floor(p/60),s=Math.round(p%60);return m+"'"+String(s).padStart(2,'0')+'"'}function tick(){if(running&&!paused){elapsed=(Date.now()-startAt)/1000;$('time').textContent=fmtTime(elapsed);$('pace').textContent=fmtPace(elapsed/km)}}function startRun(){if(!navigator.geolocation){alert('GPS를 사용할 수 없습니다.');return}if(running){paused=false;startAt=Date.now()-elapsed*1000;return}running=true;startAt=Date.now();timer=setInterval(tick,1000);watchId=navigator.geolocation.watchPosition(pos=>{if(paused)return;let p=pos.coords;$('gpsState').textContent='GPS 수신 · 정확도 '+Math.round(p.accuracy)+'m';if(lastPos&&p.accuracy<60){let d=hav(lastPos,p);if(d<.2)km+=d}lastPos={latitude:p.latitude,longitude:p.longitude};$('distance').textContent=km.toFixed(2)},()=>{$('gpsState').textContent='GPS 권한을 허용해주세요.'},{enableHighAccuracy:true,maximumAge:1000,timeout:10000})}function pauseRun(){if(!running)return;paused=!paused;if(!paused)startAt=Date.now()-elapsed*1000}function finishRun(){if(!running)return;running=false;clearInterval(timer);if(watchId!==null)navigator.geolocation.clearWatch(watchId);let a=JSON.parse(localStorage.getItem('runs')||'[]');a.unshift({date:new Date().toISOString(),km:+km.toFixed(2),seconds:Math.round(elapsed),pace:km?elapsed/km:0});localStorage.setItem('runs',JSON.stringify(a));render();showPage('records')}function render(){let a=JSON.parse(localStorage.getItem('runs')||'[]'),n=new Date(),m=a.filter(r=>{let d=new Date(r.date);return d.getMonth()==n.getMonth()&&d.getFullYear()==n.getFullYear()});$('monthKm').textContent=m.reduce((x,r)=>x+r.km,0).toFixed(2);$('monthRuns').textContent=m.length;$('lastPace').textContent=a.length?fmtPace(a[0].pace):'--';$('history').innerHTML=a.length?a.map(r=>'<li><span>'+new Date(r.date).toLocaleDateString('ko-KR')+'<br><small>'+fmtTime(r.seconds)+'</small></span><b>'+r.km.toFixed(2)+' km<br><small>'+fmtPace(r.pace)+'/km</small></b></li>').join(''):'<li>아직 기록이 없습니다.</li>'}function loadPhotos(e){let fs=[...e.target.files],room=10-photos.length;if(fs.length>room)alert('사진은 최대 10장까지 가능합니다.');fs.slice(0,room).forEach(f=>{let u=URL.createObjectURL(f),i=new Image();i.onload=()=>{photos.push({img:i,url:u});drawPhotos()};i.src=u});e.target.value=''}function drawPhotos(){$('photoCount').textContent=photos.length;$('photos').innerHTML=photos.map((p,i)=>'<div class="photoItem"><img src="'+p.url+'"><button class="del" onclick="removePhoto('+i+')">×</button></div>').join('')}function removePhoto(i){URL.revokeObjectURL(photos[i].url);photos.splice(i,1);drawPhotos();blob=null;$('canvas').style.display='none'}function drawCaption(x,text,W,H){if(!text.trim())return;x.save();x.textAlign='right';x.textBaseline='middle';x.font='italic 700 46px "Noto Sans KR",system-ui';let lines=text.trim().split(/\n/),out=[];lines.forEach(line=>{let words=[...line],cur='';words.forEach(ch=>{if(x.measureText(cur+ch).width>620){out.push(cur);cur=ch}else cur+=ch});if(cur)out.push(cur)});out=out.slice(0,3);let y=H-430-(out.length-1)*30;x.shadowColor='rgba(0,0,0,.85)';x.shadowBlur=12;x.lineWidth=5;x.strokeStyle='rgba(0,0,0,.45)';x.fillStyle='#fff';out.forEach((line,i)=>{x.strokeText(line,W-65,y+i*62);x.fillText(line,W-65,y+i*62)});x.restore()}function makeImage(){if(!photos.length){alert('사진을 먼저 선택해주세요.');return}let a=JSON.parse(localStorage.getItem('runs')||'[]'),r=a[0];if(!r){alert('먼저 러닝 기록을 저장해주세요.');return}let photo=photos[0].img,c=$('canvas'),x=c.getContext('2d'),W=c.width,H=c.height,ir=photo.width/photo.height,cr=W/H,sx=0,sy=0,sw=photo.width,sh=photo.height;if(ir>cr){sw=photo.height*cr;sx=(photo.width-sw)/2}else{sh=photo.width/cr;sy=(photo.height-sh)/2}x.drawImage(photo,sx,sy,sw,sh,0,0,W,H);let g=x.createLinearGradient(0,H*.4,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.88)');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='white';x.font='900 54px system-ui';x.fillText('RUNMATE',70,100);drawCaption(x,$('photoText').value,W,H);x.font='900 86px system-ui';x.fillText(r.km.toFixed(2)+' KM',70,H-270);x.font='700 42px system-ui';x.fillText('TIME  '+fmtTime(r.seconds),70,H-175);x.fillText('PACE  '+fmtPace(r.pace)+'/km',550,H-175);x.font='600 32px system-ui';x.fillText(new Date(r.date).toLocaleDateString('ko-KR'),70,H-95);c.style.display='block';c.toBlob(b=>blob=b,'image/jpeg',.94);$('shareHint').textContent='완성되었습니다. 문구까지 사진에 적용했습니다.'}function saveImage(){if(!blob){makeImage();setTimeout(saveImage,350);return}let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RUNMATE-'+new Date().toISOString().slice(0,10)+'.jpg';a.click()}async function shareImage(){if(!blob){makeImage();setTimeout(shareImage,400);return}let f=new File([blob],'RUNMATE.jpg',{type:'image/jpeg'});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'RUNMATE 러닝 기록'});else saveImage()}catch(e){}}let saved=localStorage.getItem('targetDistance')||'10';$('targetDistance').value=saved;document.querySelectorAll('.course button').forEach(b=>b.classList.toggle('on',b.dataset.km===saved));render();</script></body></html>
