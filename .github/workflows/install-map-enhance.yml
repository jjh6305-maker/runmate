name: Install RUNMATE map enhancement
on:
  push:
    paths:
      - '.github/workflows/install-map-enhance.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject map enhancement script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="map-enhance.js?v=2"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name "runmate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enable Leaflet route map enhancement"
          git push