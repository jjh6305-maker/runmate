name: Install RUNMATE background settings
on:
  push:
    paths:
      - 'background-settings.js'
      - '.github/workflows/install-background-settings.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add loader to index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="background-settings.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enable customizable app background photo"
          git push